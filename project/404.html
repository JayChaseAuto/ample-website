<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 — ample.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Served by GitHub Pages for any stray path at any depth, so the home
     link must be absolute. Update on custom-domain flip (grep:
     jaychaseauto.github.io). Hash deep links (#/...) never land here —
     fragments aren't sent to the server. No JS, no external requests. -->
<style>
  html, body { margin: 0; min-height: 100vh; background: #0B0B0D; color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; }
  main { text-align: center; padding: 24px; }
  .code { font-size: 12px; font-weight: 700; letter-spacing: 0.3em;
    color: #E92024; text-transform: uppercase; }
  h1 { font-size: clamp(32px, 7vw, 56px); font-weight: 800;
    text-transform: uppercase; letter-spacing: -0.02em; margin: 12px 0 8px; }
  p { color: rgba(255,255,255,0.55); font-size: 15px; line-height: 1.6;
    margin: 0 0 28px; }
  a.btn { display: inline-block; background: #E92024; color: #fff;
    text-decoration: none; font-size: 12px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; padding: 14px 28px;
    border-radius: 2px; }
  a.btn:hover { background: #c91b1f; }
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>Part not found.</h1>
  <p>This page isn't in our catalog. The part you're looking for may have<br>moved, or the URL took a wrong turn.</p>
  <a class="btn" href="https://ampleproducts.ca/">Back to the garage</a>
</main>
</body>
</html>
