<!-- Editor-only error overlay. Catches uncaught script errors (Babel parse
     failures, runtime throws) and renders them on top of the black <body>
     so we don't stare at a blank screen. Auto-hides on next clean load. -->
<script>
(function () {
  // Cap the overlay so a render-loop error firing at 60Hz can't grow the
  // textContent past the heap. Also coalesce consecutive identical messages
  // into a single line with a "(×N)" counter, since most fault loops repeat
  // the same stack — keeps the overlay readable instead of a wall of
  // duplicates.
  var MAX_LEN = 64 * 1024;
  var lastMsg = null, lastBlock = null, lastCount = 0;
  function show(msg, kind) {
    var box = document.getElementById('__ample_err');
    if (!box) {
      box = document.createElement('pre');
      box.id = '__ample_err';
      box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;'
        + 'margin:0;padding:14px 18px;background:#1a0a0a;color:#ff6b6b;'
        + 'font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;'
        + 'white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto;'
        + 'border-bottom:2px solid #ff6b6b;';
      (document.body || document.documentElement).appendChild(box);
    }
    var block = '[' + kind + '] ' + msg;
    if (block === lastBlock) {
      lastCount++;
      box.textContent = (box.textContent.replace(/\s*\(×\d+\)\n\n$/, '\n\n'))
        .replace(/\n\n$/, ' (×' + lastCount + ')\n\n');
      return;
    }
    lastBlock = block;
    lastCount = 1;
    box.textContent += block + '\n\n';
    // Hard cap — trim oldest content if we'd otherwise exceed MAX_LEN.
    if (box.textContent.length > MAX_LEN) {
      box.textContent = '… [older messages trimmed] …\n\n'
        + box.textContent.slice(-MAX_LEN);
    }
  }
  window.addEventListener('error', function (e) {
    show((e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + '  '
      + (e.message || '?') + (e.error && e.error.stack ? '\n' + e.error.stack : ''),
      'error');
  });
  window.addEventListener('unhandledrejection', function (e) {
    show((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason), 'unhandled promise');
  });
})();
</script>

<script>
(function () {
  try {
    var host = window.location.hostname;
    var isLocal = !host || host === 'localhost' || host === '127.0.0.1';
    if (!isLocal) {
      window.__ampleEditor = false;

    }
    var params = new URLSearchParams(window.location.search);
    var flag = params.get('edit');
    if (flag === '1') localStorage.setItem('__ampleEditor', '1');
    if (flag === '0') localStorage.removeItem('__ampleEditor');
    var stored = localStorage.getItem('__ampleEditor') === '1';
    window.__ampleEditor = flag === '1' || stored || flag !== '0';
  } catch (e) { window.__ampleEditor = false; }

/* Escape a URL for interpolation inside a CSS url("...") — backslashes and
   double quotes would otherwise break out of the quoted argument and let
   the rest of the string parse as style declarations. Matches the escaping
   applyTweaksToDOM already does for the site background. */
function cssUrl(u) {
  return String(u).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
}

/* exportTweaksState — normalises the in-memory tweak state for source.
   1. Walks the object for stragglers (blob: URLs, data: URLs).
   2. Each one is uploaded to the dev server via writeImageToAssets so the
      bytes actually land in project/assets/ — no manual file moves.
   3. Returns the cleaned JSON ready to paste between EDITMODE markers
      AND the list of uploaded filenames for the success UI.

   In normal use no stragglers exist: useImageDrop already wrote the file
   on drop, so the state already holds an "assets/..." path. This function
   is a backstop for the rare case where a drop happened while the dev
   server was offline. */
async function exportTweaksState(t) {
  const clone = JSON.parse(JSON.stringify(t));
  const uploads = [];
  const failures = [];
  const slugify = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-')
                                  .replace(/^-+|-+$/g, '');
  const needsUpload = (v) =>
    typeof v === 'string' && /^(data:(image|video)\/|blob:)/i.test(v);

  // Convert a data: or blob: URL into a Blob the writer expects.
  // For data: URLs we round-trip via fetch — that's the standard way to
  // decode base64 into a Blob in the browser.
  async function urlToBlob(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`fetch ${url.slice(0, 32)}… → HTTP ${r.status}`);
    return await r.blob();
  }

  async function lift(prefix, value) {
    if (!needsUpload(value)) return value;
    try {
      const blob = await urlToBlob(value);
      const path = await window.writeImageToAssets(blob, prefix);
      uploads.push(path);
      return path;
    } catch (e) {
      failures.push({ prefix, error: (e && e.message) || String(e) });
      // Leave the original value so the user still sees something —
      // but the failures array makes the save UI surface this.
      return value;
    }
  }

  // liftSlot: walks a bag entry that's either a bare string OR the new
  // { url, position, scale, fit } shape, uploads the URL if it's a data/
  // blob URL, and preserves the meta. Returns the (possibly updated)
  // entry. Keeps shape stable across save → reload.
  async function liftSlot(prefix, v) {
    if (v && typeof v === 'object') {
      if (needsUpload(v.url)) return { ...v, url: await lift(prefix, v.url) };
      return v;
    }
    return await lift(prefix, v);
  }

  // Every image-bearing field routes through liftSlot — works for bare
  // strings AND { url, position, scale, fit } objects. Using lift() here
  // would silently ship blob:/data: URLs to source if any of these fields
  // were ever upgraded to slot shape.
  clone.heroImage = await liftSlot('custom-hero', clone.heroImage);
  if (clone.categoryImages) {
    for (const k of Object.keys(clone.categoryImages)) {
      clone.categoryImages[k] = await liftSlot(`custom-cat-${slugify(k)}`, clone.categoryImages[k]);
    }
  }
  if (clone.productOverrides) {
    for (const slug of Object.keys(clone.productOverrides)) {
      const o = clone.productOverrides[slug];
      if (o && o.heroBgImage) {
        o.heroBgImage = await liftSlot(`custom-product-${slugify(slug)}-hero`, o.heroBgImage);
      }
      if (o && o.calloutImage) {
        o.calloutImage = await liftSlot(`custom-callout-${slugify(slug)}`, o.calloutImage);
      }
      // Banner gallery — an ordered array of { url, alt } slots. liftSlot
      // uploads any straggler blob:/data: url and preserves alt; assets/
      // paths pass through untouched.
      if (o && Array.isArray(o.banners)) {
        o.banners = await Promise.all(o.banners.map((slot, i) =>
          liftSlot(`custom-product-${slugify(slug)}-banner-${i + 1}`, slot)
        ));
      }
    }
  }
  if (clone.catalogCardImages) {
    for (const k of Object.keys(clone.catalogCardImages)) {
      clone.catalogCardImages[k] = await liftSlot(`custom-card-${slugify(k)}`, clone.catalogCardImages[k]);
    }
  }
  if (clone.storyImages) {
    for (const k of Object.keys(clone.storyImages)) {
      clone.storyImages[k] = await liftSlot(`custom-history-${slugify(k)}`, clone.storyImages[k]);
    }
  }
  clone.siteBackgroundImage = await liftSlot('custom-site-bg', clone.siteBackgroundImage);
  clone.goldStandardMedia = await liftSlot('custom-gold-dyno', clone.goldStandardMedia);
  if (clone.goldFeatureImages) {
    for (const k of Object.keys(clone.goldFeatureImages)) {
      clone.goldFeatureImages[k] = await liftSlot(`custom-gold-${slugify(k)}`, clone.goldFeatureImages[k]);
    }
  }

  // Any straggler blob:/data: URL that survived the lifts (an upload failed)
  // must never reach source — it would be a permanently dead reference for
  // every visitor. Strip them; the failures array tells the save UI exactly
  // which slots were dropped.
  const cleaned = (typeof __stripDataUrls === 'function')
    ? (__stripDataUrls(clone) || {})
    : clone;

  // Format JSON to match the existing TWEAK_DEFAULTS style: 2-space indent,
  // forward slashes escaped (matches what Claude Design writes back).
  const json = JSON.stringify(cleaned, null, 2).replace(/\//g, '\\/');

  return { json, uploads, failures };
}

/* saveTweaksToSource — bakes the current tweak state into index.html's
   TWEAK_DEFAULTS block via POST /__editor/save_index. The dev server reads
   index.html, swaps the /*EDITMODE-BEGIN*..*EDITMODE-END*\/ contents
   atomically, and writes back. Any straggler in-memory URLs get uploaded
   by exportTweaksState first, so a successful save guarantees every
   reference in source points at a real file on disk. */
async function saveTweaksToSource(t) {
  try {
    const exported = await exportTweaksState(t);
    if (exported.failures.length) {
      // Refuse to save when any image failed to land on disk. Proceeding
      // would bake a stripped (missing) image into source for every visitor;
      // better to fail loudly and let the user retry once uploads work.
      const slots = exported.failures.map((f) => f.prefix).join(', ');
      return {
        ok: false,
        error: `Save aborted — ${exported.failures.length} image upload(s) failed (${slots}). ` +
               'Is the dev server running? Fix the uploads and save again.',
      };
    }
    const resp = await fetch('/__editor/save_index', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tweaksJson: exported.json }),
    });
    let body = null;
    try { body = await resp.json(); } catch {}
    if (!resp.ok) {
      const reason = (body && body.error) || `HTTP ${resp.status}`;
      return {
        ok: false,
        error: `Save failed: ${reason}. Is the dev server running? (\`py dev-server.py\`)`,
      };
    }
    return {
      ok: true,
      filename: 'index.html',
      uploads: exported.uploads,
      failures: exported.failures,
    };
  } catch (e) {
    return {
      ok: false,
      error: `Save failed: ${(e && e.message) || String(e)}. Is the dev server running? (\`py dev-server.py\`)`,
    };
  }
}

function useHashRoute() {
  const get = () => (window.location.hash || '#/').slice(1);
  const [path, setPath] = React.useState(get());
  React.useEffect(() => {
    const on = () => { setPath(get()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return path;
}

function applyTweaksToDOM(t) {
  const root = document.documentElement;
  root.style.setProperty('--ample-red', t.accentColor);
  // derived hot/deep variants — slight lighten/darken via color-mix
  root.style.setProperty('--ample-red-hot', `color-mix(in srgb, ${t.accentColor} 85%, white)`);
  root.style.setProperty('--ample-red-deep', `color-mix(in srgb, ${t.accentColor} 78%, black)`);
  root.style.setProperty('--accent', t.accentColor);
  root.style.setProperty('--border-hot', t.accentColor);
  root.setAttribute('data-theme', t.theme);
  // Global banner-showcase scale (desktop only — the CSS clamps to 100% width
  // on narrow screens, so mobile is unaffected). Default 75% since the
  // full-width banners ran large on desktop.
  {
    const bs = (typeof t.bannerScale === 'number') ? t.bannerScale : 75;
    root.style.setProperty('--banner-scale', String(Math.max(40, Math.min(100, bs)) / 100));
  }
  // Site-wide background image. Set the CSS variable .atm-bg consumes —
  // empty/unset → no image, anything else → wrap in url(). Single source of
  // truth so both first-paint (pre-React shim) and live edits stay in sync.
  // Escape backslash and double-quote so a path containing either does not
  // break out of the url() argument and let stray characters become CSS.
  // The .atm-bg rule consumes this via var() inside /styles/colors_and_type.css,
  // where a relative url() resolves against the STYLESHEET (so "assets/x" would
  // 404 at /styles/assets/x). Resolve to a fully-qualified URL against the
  // document base — correct both on a localhost root deploy AND a GitHub Pages
  // project deploy served from /<repo>/ (a root-absolute "/assets/x" points at
  // the domain root and 404s there).
  if (t.siteBackgroundImage) {
    let raw = String(t.siteBackgroundImage);
    if (!/^(data:|blob:|[a-z][a-z0-9.+-]*:)/i.test(raw)) {
      try { raw = new URL(raw.replace(/^\/+/, ''), document.baseURI).href; } catch (e) {}
    }
    const safe = raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    root.style.setProperty('--site-bg-image', `url("${safe}")`);
  } else {
    root.style.removeProperty('--site-bg-image');
  }
}

/* SiteBgDropCard — small drop slot inside the Tweaks panel Style tab.
   Drag-and-drop any image and it persists into project/assets/ via the
   dev server (useImageDrop handles the upload), then the URL lands in
   tweaks.siteBackgroundImage. The .atm-bg layer reads --site-bg-image
   from there. Includes a thumbnail preview and a Clear button. */
function SiteBgDropCard() {
  const { tweaks, setTweak } = useTweakState();
  const url = tweaks.siteBackgroundImage || '';
  const dropRef = React.useRef(null);
  // Liveness probe — when a URL is set, hit it with an Image() request and
  // track whether the bytes actually load. Surfaces the difference between
  // "URL saved" and "image renders" so the user can tell a stale path apart
  // from an upload that succeeded but didn't reach the .atm-bg layer.
  const [status, setStatus] = React.useState('idle'); // idle | loading | ok | err
  React.useEffect(() => {
    if (!url) { setStatus('idle'); return; }
    setStatus('loading');
    const img = new Image();
    img.onload = () => setStatus('ok');
    img.onerror = () => setStatus('err');
    img.src = url;
    // Cleanup: drop callbacks AND clear src to abort the in-flight network
    // request. Without removeAttribute('src') the browser keeps streaming
    // the image even after we no longer care, which piles up on rapid edits.
    return () => {
      img.onload = img.onerror = null;
      img.removeAttribute('src');
    };
  }, [url]);
  useImageDrop(dropRef, (path, opts) => {
    setTweak('siteBackgroundImage', path, opts);
  }, { namePrefix: 'site-bg' });

  const dotColor = status === 'ok' ? '#34c759'
                 : status === 'err' ? '#c33a2a'
                 : status === 'loading' ? '#c9ad3b'
                 : 'rgba(0,0,0,0.2)';
  const statusText = status === 'ok' ? 'Loaded, applied to .atm-bg'
                   : status === 'err' ? 'URL set but image failed to load'
                   : status === 'loading' ? 'Loading…'
                   : 'No image set';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div
        ref={dropRef}
        className="drop-target"
        style={{
          position: 'relative', aspectRatio: '16 / 9',
          borderRadius: 8,
          border: '1px dashed rgba(0,0,0,0.25)',
          background: url
            ? `url("${cssUrl(url)}") center / cover no-repeat, rgba(0,0,0,0.06)`
            : 'rgba(0,0,0,0.06)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'rgba(41,38,27,0.55)',
          fontSize: 10.5, lineHeight: 1.3, textAlign: 'center',
          padding: 8,
        }}>
        {!url && <span>Drop an image here<br />for the site background</span>}
        <div className="drop-hint" style={{ borderRadius: 8 }}>Drop image to set site background</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 10.5,
                     color: 'rgba(41,38,27,0.7)' }}>
        <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
                        background: dotColor, flexShrink: 0,
                        boxShadow: '0 0 0 2px rgba(255,255,255,.6)' }} />
        <span style={{ flex: 1 }}>{statusText}</span>
        {url && (
          <button type="button" className="twk-btn secondary"
                  style={{ height: 22, padding: '0 8px', fontSize: 10 }}
                  onClick={() => setTweak('siteBackgroundImage', '')}>
            Clear
          </button>
        )}
      </div>
      {url && (
        <div style={{ fontSize: 10, color: 'rgba(41,38,27,0.5)',
                       fontFamily: 'ui-monospace,monospace',
                       overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {url}
        </div>
      )}
    </div>
  );
}

/* ImageDropSlot — generic in-panel drag-and-drop image slot. Generalises
   SiteBgDropCard so ANY per-product image (catalog card, hero background,
   callout/center photo) can be added by dropping a file straight into the
   Tweaks panel: useImageDrop uploads it into project/assets/ and hands the
   resolved path to onPath(path, opts). Shows a thumbnail, a load-status dot,
   the file name, and a Clear button. Purely additive — every existing
   select/knob stays; this just adds a drop affordance that works for every
   product from one place. */
function ImageDropSlot({ url, onPath, onClear, namePrefix, placeholder, hint, aspect }) {
  const dropRef = React.useRef(null);
  const [status, setStatus] = React.useState('idle'); // idle | loading | ok | err
  React.useEffect(() => {
    if (!url) { setStatus('idle'); return; }
    setStatus('loading');
    const img = new Image();
    img.onload = () => setStatus('ok');
    img.onerror = () => setStatus('err');
    img.src = url;
    return () => { img.onload = img.onerror = null; img.removeAttribute('src'); };
  }, [url]);
  // Optimistic blob fire + canonical assets/ path fire both route through
  // onPath; callers pass opts straight to their setter so the undo stack
  // stays clean (matches SiteBgDropCard / ProductBannerRow).
  useImageDrop(dropRef, (path, opts) => onPath(path, opts),
               { namePrefix: namePrefix || 'image' });
  const dot = status === 'ok' ? '#34c759'
            : status === 'err' ? '#c33a2a'
            : status === 'loading' ? '#c9ad3b'
            : 'rgba(0,0,0,0.2)';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div ref={dropRef} className="drop-target" style={{
        position: 'relative', aspectRatio: aspect || '16 / 9', borderRadius: 8,
        border: '1px dashed rgba(0,0,0,0.25)',
        background: url
          ? `url("${cssUrl(url)}") center / cover no-repeat, rgba(0,0,0,0.06)`
          : 'rgba(0,0,0,0.06)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'rgba(41,38,27,0.55)', fontSize: 10.5, lineHeight: 1.3,
        textAlign: 'center', padding: 8 }}>
        {!url && <span>{placeholder || 'Drop an image here'}</span>}
        <div className="drop-hint" style={{ borderRadius: 8 }}>{hint || 'Drop image to replace'}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 10,
                     color: 'rgba(41,38,27,0.6)' }}>
        <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
                        background: dot, flexShrink: 0,
                        boxShadow: '0 0 0 2px rgba(255,255,255,.6)' }} />
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis',
                        whiteSpace: 'nowrap', fontFamily: 'ui-monospace,monospace' }}>
          {url ? url.split('/').pop() : 'No image set'}
        </span>
        {url && onClear && (
          <button type="button" className="twk-btn secondary"
                  style={{ height: 20, padding: '0 8px', fontSize: 10 }}
                  onClick={onClear}>Clear</button>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────────────────
   Product banner editor — a variable-length, reorderable list of full-width
   marketing banners for one product (productOverrides[slug].banners, each
   entry { url, alt }). The on-page render is <ProductBanners> in
   ProductDetailPage.jsx. Each row is its own component so useImageDrop (a
   hook) is called exactly once per row. All mutations run through setTweak's
   functional updater so the optimistic blob → canonical assets/ path swap
   can't race against a stale array snapshot.
   ───────────────────────────────────────────────────────────────────────── */
function useBannerUpdater(slug, baseBanners) {
  const { setTweak } = useTweakState();
  return React.useCallback((fn, opts) => {
    setTweak((prev) => {
      const ov = prev.productOverrides || {};
      const existing = (ov[slug] && Array.isArray(ov[slug].banners)) ? ov[slug].banners : null;
      // Seed from the product's base banners only when NO override exists.
      // An existing empty array is authoritative ("all banners removed") —
      // length-checking here used to resurrect deleted base banners on the
      // next edit. Matches the page renderer's semantics.
      const cur = existing !== null ? existing : (baseBanners || []);
      const next = fn(cur.slice());
      return { productOverrides: { ...ov, [slug]: { ...(ov[slug] || {}), banners: next } } };
    }, undefined, opts);
  }, [setTweak, slug, baseBanners]);
}

function ProductBannerRow({ slug, banner, index, count, update }) {
  const dropRef = React.useRef(null);
  // Replace-in-place, addressed by VALUE not index: uploads take seconds and
  // the ↑/↓/× buttons sit on the same row, so a reorder/remove mid-upload
  // would land the canonical path on the wrong banner if we trusted the
  // render-time index. Track the URL this drop is replacing — the first
  // (optimistic blob) fire replaces the row's current URL, the second
  // (canonical assets/ path) fire replaces the blob — and find it in the
  // array at write time. Falls back to the index only if the value vanished.
  const dropTargetUrlRef = React.useRef(null);
  useImageDrop(dropRef, (path, opts) => {
    // The two fires are distinguishable: the canonical (assets/ path) fire
    // always carries skipHistory. The optimistic fire trusts the fresh
    // banner.url closure (useImageDrop keeps callbacks fresh) and records
    // the blob URL it wrote; the canonical fire looks up that exact blob —
    // so reorders/removals mid-upload can't misroute it — and clears the
    // ref so a LATER drop on this row never chases a stale URL. If the
    // target row was removed mid-upload, the upload is dropped rather than
    // clobbering an unrelated banner by index.
    const canonical = !!(opts && opts.skipHistory);
    update((arr) => {
      const prev = canonical && dropTargetUrlRef.current != null
        ? dropTargetUrlRef.current
        : (banner.url || '');
      let j = (arr[index] && (arr[index].url || '') === prev)
        ? index
        : arr.findIndex((b) => b && (b.url || '') === prev);
      if (j < 0) {
        if (canonical) return arr;
        j = Math.min(index, arr.length - 1);
      }
      if (j < 0) return arr;
      arr[j] = { ...(arr[j] || {}), url: path };
      dropTargetUrlRef.current = canonical ? null : path;
      return arr;
    }, opts);
  }, { namePrefix: `product-${slug}-banner-${index + 1}` });
  const url = banner.url || '';
  const btn = { height: 22, minWidth: 26, padding: '0 6px', fontSize: 12, lineHeight: 1 };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10,
                  border: '1px solid rgba(0,0,0,0.08)', borderRadius: 8, padding: 8 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
        <span style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: '0.04em',
                       textTransform: 'uppercase', color: 'rgba(41,38,27,0.7)' }}>Banner {index + 1}</span>
        <div style={{ display: 'flex', gap: 4 }}>
          <button type="button" className="twk-btn secondary" style={{ ...btn, opacity: index === 0 ? 0.4 : 1 }}
            disabled={index === 0} title="Move up"
            onClick={() => update((arr) => { const j = index - 1; if (j >= 0) { const tmp = arr[index]; arr[index] = arr[j]; arr[j] = tmp; } return arr; })}>↑</button>
          <button type="button" className="twk-btn secondary" style={{ ...btn, opacity: index === count - 1 ? 0.4 : 1 }}
            disabled={index === count - 1} title="Move down"
            onClick={() => update((arr) => { const j = index + 1; if (j < arr.length) { const tmp = arr[index]; arr[index] = arr[j]; arr[j] = tmp; } return arr; })}>↓</button>
          <button type="button" className="twk-btn secondary" style={btn} title="Remove"
            onClick={() => update((arr) => { arr.splice(index, 1); return arr; })}>×</button>
        </div>
      </div>
      <div ref={dropRef} className="drop-target" style={{
        position: 'relative', aspectRatio: '16 / 9', borderRadius: 6,
        border: '1px dashed rgba(0,0,0,0.25)',
        background: url ? `url("${cssUrl(url)}") center / cover no-repeat, rgba(0,0,0,0.06)` : 'rgba(0,0,0,0.06)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'rgba(41,38,27,0.55)', fontSize: 10.5, textAlign: 'center', padding: 8 }}>
        {!url && <span>Drop image</span>}
        <div className="drop-hint" style={{ borderRadius: 6 }}>Drop to replace banner {index + 1}</div>
      </div>
      <TweakText label="Alt / caption (optional)" value={banner.alt || ''}
                 onChange={(v) => update((arr) => { arr[index] = { ...(arr[index] || {}), alt: v }; return arr; })} />
    </div>
  );
}

function AddBannerSlot({ slug, count, update }) {
  const dropRef = React.useRef(null);
  // Append-on-drop. Only commit the canonical assets/ path (ignore the
  // optimistic blob fire) so one drop adds exactly one banner instead of a
  // dead blob entry plus the real one.
  useImageDrop(dropRef, (path) => {
    if (typeof path === 'string' && path.startsWith('blob:')) return;
    update((arr) => { arr.push({ url: path, alt: '' }); return arr; });
  }, { namePrefix: `product-${slug}-banner-${count + 1}` });
  return (
    <div ref={dropRef} className="drop-target" style={{
      position: 'relative', aspectRatio: '16 / 5', borderRadius: 6,
      border: '1px dashed rgba(0,0,0,0.3)', background: 'rgba(0,0,0,0.04)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: 'rgba(41,38,27,0.6)', fontSize: 11, textAlign: 'center', padding: 8 }}>
      <span>+ Drop image to add a banner</span>
      <div className="drop-hint" style={{ borderRadius: 6 }}>Drop to add banner</div>
    </div>
  );
}

function ProductBannerEditor({ slug }) {
  const { tweaks, setProductTweak } = useTweakState();
  const baseBanners = (window.PRODUCTS && window.PRODUCTS[slug] && window.PRODUCTS[slug].banners) || [];
  const update = useBannerUpdater(slug, baseBanners);
  const pov = (tweaks.productOverrides || {})[slug] || {};
  const ov = pov.banners;
  // Mirror what's on the page: ANY array override is authoritative (an empty
  // one means "all banners deleted" — listing base banners here would lie
  // and the next edit would write them back). Only no-override falls back.
  const banners = Array.isArray(ov) ? ov : baseBanners;
  // Banner display knobs: fit (Fill/Fit) + a fixed pixel height. Height 0 =
  // auto-size to each image's natural ratio (the default carousel behaviour).
  const bannerFit = pov.bannerFit || 'contain';
  const bannerHeight = typeof pov.bannerHeight === 'number' ? pov.bannerHeight : 0;
  return (
    <>
      <TweakSection label="Product · Banners"
                    subtitle="Full-width graphics shown below the callouts. Drop, reorder (↑ ↓), or remove (×)." />
      <TweakRadio label="Image fit" value={bannerFit}
                  options={[{ value: 'contain', label: 'Fit' }, { value: 'cover', label: 'Fill' }]}
                  onChange={(v) => setProductTweak(slug, 'bannerFit', v)} />
      <TweakSlider label="Image height" value={bannerHeight}
                   min={0} max={520} step={10} unit={bannerHeight ? 'px' : ''}
                   onChange={(v) => setProductTweak(slug, 'bannerHeight', v)} />
      <div style={{ fontSize: 10, color: 'rgba(41,38,27,.55)', lineHeight: 1.4, marginTop: -2 }}>
        Height 0 = auto-fit each image. “Fill” crops to the set height; “Fit” shows the whole image.
      </div>
      {banners.map((b, i) => (
        <ProductBannerRow key={`banner-${i}`} slug={slug} banner={b || {}} index={i}
                          count={banners.length} update={update} />
      ))}
      <AddBannerSlot slug={slug} count={banners.length} update={update} />
    </>
  );
}

function App() {
  const path = useHashRoute();
  const [t, setTweak, history] = useTweaks(TWEAK_DEFAULTS);

  // Preview mode: 'desktop' is normal full-page render, 'mobile' shows the
  // page inside a 390-wide iframe. Toggle only renders for editors at the
  // top window — inside the iframe we always render the normal page.
  const isInIframe = typeof window !== 'undefined' && window.self !== window.top;
  const showPreviewToggle = typeof window !== 'undefined' && window.__ampleEditor && !isInIframe;
  const [previewMode, setPreviewMode] = React.useState('desktop');

  // Which product the Catalog tab is currently editing. Local UI state —
  // doesn't belong in the saved tweak file. Defaults to the first product
  // so the controls are populated on first visit.
  const [catalogEditingSlug, setCatalogEditingSlug] = React.useState(
    () => (window.PRODUCT_ORDER && window.PRODUCT_ORDER[0]) || ''
  );

  // Helpers built on top of setTweak's functional-updater form so they read
  // the latest state at write time (no stale closures).
  // All three helpers accept an optional `opts` (e.g., { skipHistory: true })
  // that forwards to setTweak. Used by useImageDrop's post-upload path swap
  // to keep the undo stack clean — the optimistic preview already pushed a
  // history entry, the canonical-path follow-up must not push another.
  const setProductTweak = React.useCallback((slug, key, value, opts) => {
    setTweak((prev) => ({
      productOverrides: {
        ...(prev.productOverrides || {}),
        [slug]: { ...((prev.productOverrides || {})[slug] || {}), [key]: value },
      },
    }), undefined, opts);
  }, [setTweak]);
  const mergeImageBag = React.useCallback((bagKey, key, value, opts) => {
    setTweak((prev) => ({
      [bagKey]: { ...(prev[bagKey] || {}), [key]: value },
    }), undefined, opts);
  }, [setTweak]);
  // Like mergeImageBag, but the value is a PATCH on the slot's object form
  // — so setting position doesn't clobber url, and setting a new url
  // preserves position/scale/fit. Strings in the bag are upgraded to
  // objects on first patch.
  const mergeImageSlot = React.useCallback((bagKey, key, patch, opts) => {
    setTweak((prev) => {
      const bag = prev[bagKey] || {};
      const cur = bag[key];
      const existing = (cur && typeof cur === 'object')
        ? cur
        : { url: typeof cur === 'string' ? cur : '' };
      return { [bagKey]: { ...bag, [key]: { ...existing, ...patch } } };
    }, undefined, opts);
  }, [setTweak]);

  // Context value — single source of truth. TweaksProvider also mirrors
  // the setters onto window.__ample* for any external embeds. History
  // (undo/redo/canUndo/canRedo) flows through so the panel can show
  // disabled-state buttons and so any consumer can trigger undo
  // programmatically.
  const tweaksContextValue = React.useMemo(
    () => ({ tweaks: t, setTweak, setProductTweak, mergeImageBag, mergeImageSlot, history }),
    [t, setTweak, setProductTweak, mergeImageBag, mergeImageSlot, history]
  );

  // Global undo/redo keyboard shortcuts — editor only, suppressed while
  // typing in inputs/textareas so they don't fight the browser's own
  // text-editing Ctrl+Z. Works whether the panel is open or closed.
  React.useEffect(() => {
    if (!window.__ampleEditor) return;
    const onKey = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const el = e.target;
      const tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' ||
          (el && el.isContentEditable)) return;
      const isZ = e.key === 'z' || e.key === 'Z';
      const isY = e.key === 'y' || e.key === 'Y';
      if (isZ && !e.shiftKey) { e.preventDefault(); history.undo(); }
      else if ((isZ && e.shiftKey) || isY) { e.preventDefault(); history.redo(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [history]);

  // CSS variables / data-theme — still needs to run on every t change.
  React.useEffect(() => { applyTweaksToDOM(t); }, [t]);
  if (typeof window !== 'undefined' && !window.__ampleTweaks) {
    // Pre-mount best-effort so CSS variables apply on first paint before
    // TweaksProvider's useEffect runs.
    window.__ampleTweaks = t;
    applyTweaksToDOM(t);
  }

  let page;
  let productSlug = null;
  if (path === '/' || path === '') page = <HomePage />;
  else if (path === '/catalog') page = <CatalogPage />;
  else if (path.startsWith('/catalog/')) {
    const cat = decodeURIComponent(path.slice('/catalog/'.length));
    page = <CatalogPage filter={cat} />;
  }
  else if (path === '/gold') page = <GoldStandardPage />;
  else if (path === '/story') page = <StoryPage />;

    const all = t.productOverrides || {};
    for (const slug of Object.keys(all)) {

      if (u && !seen.has(u)) {

  // Atmosphere layer visibility.

  // Save flow — writes the current tweak state into index.html via the

  const [exportResult, setExportResult] = React.useState(null);
  const handleExport = async () => {

  const [saveResult, setSaveResult] = React.useState(null);
  const handleSave = async () => {

    window.__ampleSavePending = true;
    setSaveResult({ pending: true });

    if (r && r.ok) {
      // The in-memory state now equals the saved source. Drop the
      // localStorage draft so the next load hydrates from the freshly
      // saved defaults instead of a stale shadow copy that silently wins
      // over source forever (the root of local-vs-live drift).
      // The suppress flag stops the panel's pending debounce timer AND the
      // pagehide flush (fired by the auto-reload moments later) from

      window.__ampleTweaksSuppressPersist = true;

  const [devStatus, setDevStatus] = React.useState(null);
  const checkDevServer = React.useCallback(async () => {
    setDevStatus(null);
    if (typeof window.resetDevServerProbe === 'function') {
      window.resetDevServerProbe();
    }

      ? await window.detectDevServer()
      : { ok: false, reason: 'editor helpers not loaded' };
    setDevStatus(r);

  React.useEffect(() => { checkDevServer(); }, [checkDevServer]);

  // Live drop telemetry from useImageDrop. inFlight counts uploads still
  // running; lastOk / lastErr feed the toast strip in the corner.
  const [uploads, setUploads] = React.useState({ inFlight: 0, lastOk: null, lastErr: null });
  React.useEffect(() => {
    const onStart = () => setUploads((u) => ({ ...u, inFlight: u.inFlight + 1 }));
    const onOk = (e) => setUploads((u) => ({
      inFlight: Math.max(0, u.inFlight - 1),
      lastOk: { path: e?.detail?.path, at: Date.now() },
      lastErr: null,
    }));
    const onErr = (e) => setUploads((u) => ({
      inFlight: Math.max(0, u.inFlight - 1),
      lastOk: u.lastOk,
      lastErr: { reason: e?.detail?.reason || 'unknown', at: Date.now() },
    }));
    window.addEventListener('ample-upload-start', onStart);
    window.addEventListener('ample-upload-success', onOk);
    window.addEventListener('ample-upload-error', onErr);
    return () => {

      window.removeEventListener('ample-upload-success', onOk);

    }, 2400);
    return () => clearTimeout(id);
  }, [uploads.lastOk]);

  React.useEffect(() => {

                <div style={{ fontWeight: 600 }}>✓ Locked to <code style={{ fontSize: 10 }}>{saveResult.filename}</code></div>
                {saveResult.uploads && saveResult.uploads.length > 0 && (
                  <div style={{ marginTop: 4, color: 'rgba(41,38,27,.7)' }}>
                    Promoted {saveResult.uploads.length} in-memory image{saveResult.uploads.length === 1 ? '' : 's'} into <code style={{ fontSize: 10 }}>assets/</code>:
                    <div style={{ fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: 10, color: 'rgba(41,38,27,.62)', marginTop: 2 }}>
                      {saveResult.uploads.map((p) => <div key={p}>· {p}</div>)}
                    </div>
                  </div>
                )}
                {saveResult.failures && saveResult.failures.length > 0 && (
                  <div style={{ marginTop: 4, color: '#a13a2a' }}>
                    {saveResult.failures.length} image{saveResult.failures.length === 1 ? '' : 's'} couldn't be uploaded, so they remain in memory only. Check dev server.
                  </div>
                )}
                <div style={{ marginTop: 4, color: 'rgba(41,38,27,.62)' }}>Refresh to see the locked-in defaults.</div>
              </div>
            ) : (
              <div style={{ fontSize: 11, color: '#a13a2a' }}>{saveResult.error}</div>
            )}
          </div>
        )}
        <TweakButton label="Copy JSON only" secondary onClick={handleExport} />
        {exportResult && exportResult.pending && (
          <div style={{ fontSize: 11, color: 'rgba(41,38,27,.7)' }}>Preparing…</div>
        )}
        {exportResult && !exportResult.pending && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 4 }}>
            {exportResult.failures && exportResult.failures.length > 0 && (
              <div style={{ fontSize: 11, lineHeight: 1.5, color: '#a02a20',
                            padding: '6px 8px', borderRadius: 6,
                            background: 'rgba(195,58,42,0.08)',
                            border: '1px solid rgba(195,58,42,0.25)' }}>
                {exportResult.failures.length} image upload(s) failed and were stripped
                from this JSON ({exportResult.failures.map((f) => f.prefix).join(', ')}).
                Fix the uploads before pasting, or those slots ship empty.
              </div>
            )}
            {exportResult.uploads && exportResult.uploads.length > 0 && (
              <div style={{ fontSize: 11, lineHeight: 1.5, color: 'rgba(41,38,27,.78)' }}>
                <div style={{ fontWeight: 600, marginBottom: 4 }}>
                  Uploaded {exportResult.uploads.length} image{exportResult.uploads.length === 1 ? '' : 's'}:
                </div>
                <div style={{ fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize: 10, color: 'rgba(41,38,27,.62)' }}>
                  {exportResult.uploads.map((p) => <div key={p}>· {p}</div>)}
                </div>
              </div>
            )}
            <div style={{ fontSize: 10.5, lineHeight: 1.5, color: 'rgba(41,38,27,.7)' }}>
              JSON copied to clipboard. Paste between <code style={{ fontSize: 10 }}>/*EDITMODE-BEGIN*/</code> and <code style={{ fontSize: 10 }}>/*EDITMODE-END*/</code> in <code style={{ fontSize: 10 }}>index.html</code>, then refresh. <em>Tip: Save & lock above does this for you.</em>
            </div>
            <textarea readOnly value={exportResult.json}
              style={{ width: '100%', height: 110, fontFamily: 'ui-monospace,SFMono-Regular,Menlo,monospace',
                       fontSize: 10, lineHeight: 1.4, padding: 8, borderRadius: 7,
                       border: '.5px solid rgba(0,0,0,.1)', background: 'rgba(255,255,255,.6)',
                       color: 'inherit', outline: 'none', resize: 'vertical', boxSizing: 'border-box' }}
              onFocus={(e) => {
                e.target.select();
                if (navigator.clipboard?.writeText) navigator.clipboard.writeText(exportResult.json).catch(() => {});
              }} />
          </div>
        )}
        </TweakTab>

        </TweakTabs>
        </>
          );
        })()}
      </TweaksPanel>
    </div>
    </TweaksProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Auto-reload — editor only. Polls /__editor/version every 2s; when the
     max mtime under project/ changes, reloads the page. Skipped if not in
     editor mode (visitors), and gracefully no-ops if the dev server is
     down. The server intentionally excludes assets/ from the watch so a
     drop doesn't trigger reload mid-edit. -->
<script>
(function () {
  if (!window.__ampleEditor) return;
  let last = null;
  let consecutiveFails = 0;
  async function tick() {
    try {
      const r = await fetch('/__editor/version', { cache: 'no-store' });
      if (!r.ok) { consecutiveFails++; return; }
      consecutiveFails = 0;
      const { version } = await r.json();
      if (last == null) { last = version; return; }
      if (version !== last) {
        // Don't reload mid-upload or mid-save — Save & lock bumps the
        // index.html mtime and would race the in-flight PUT, dropping
        // the asset silently. Defer until activity drains; we'll catch
        // the change on the next poll once flags clear.
        if ((window.__ampleUploadsInFlight || 0) > 0 || window.__ampleSavePending) {
          return;
        }
        console.log('[ample] source changed → reload');
        location.reload();
      }
    } catch {
      consecutiveFails++;
    }
  }
  // 2s normal cadence. After 5 consecutive fails (server stopped) back
  // off to 10s so the console isn't noisy.
  setInterval(() => {
    if (consecutiveFails >= 5 && Date.now() % 10000 > 2000) return;
    tick();
  }, 2000);
})();
</script>

<!-- Seasonal Canada Day greeting: a once-per-visitor modal popup AND a
     persistent dismissible top banner. Both self-remove from Jul 2, 2026
     onward (date check, no deploy needed) and each remembers its own
     dismissal. Pure vanilla so it works identically in dev (babel) and the
     compiled production build, and lives outside #root so React re-renders
     never disturb it. To retire early, delete this script + the .cdpop-* /
     .cdbanner-* CSS + the webp asset (search `cdpop`/`cdbanner`). -->
<script>
(function () {
  // Hide from Jul 2 onward (local time) — i.e. visible through all of Jul 1.
  var CUTOFF = new Date(2026, 6, 2, 0, 0, 0); // month is 0-indexed: 6 = July
  var POP_KEY = 'ample_canada_day_2026_dismissed';
  var BANNER_KEY = 'ample_canada_day_2026_banner_dismissed';

  function dismissed(key) {
    try { return localStorage.getItem(key) === '1'; } catch (e) { return false; }
  }
  function remember(key) {
    try { localStorage.setItem(key, '1'); } catch (e) {}
  }

  // Slim festive bar at the very top of the page (above the sticky header,
  // in normal flow so it scrolls away). Independent of the popup.
  function buildBanner() {
    if (dismissed(BANNER_KEY) || document.getElementById('cdbanner')) return;
    var bar = document.createElement('div');
    bar.id = 'cdbanner';
    bar.className = 'cdbanner';
    bar.setAttribute('role', 'region');
    bar.setAttribute('aria-label', 'Canada Day');
    bar.innerHTML =
      '<span class="cdbanner-msg">🍁 Happy Canada Day from ample.</span>' +
      '<button type="button" class="cdbanner-close" aria-label="Dismiss">×</button>';
    bar.querySelector('.cdbanner-close').addEventListener('click', function () {
      remember(BANNER_KEY);
      if (bar.parentNode) bar.parentNode.removeChild(bar);
    });
    document.body.insertBefore(bar, document.body.firstChild);
  }

  // Once-per-visitor centered modal using the supplied poster image.
  function buildPopup() {
    if (dismissed(POP_KEY) || document.getElementById('cdpop')) return;
    var back = document.createElement('div');
    back.id = 'cdpop';
    back.className = 'cdpop-backdrop';
    back.setAttribute('role', 'dialog');
    back.setAttribute('aria-modal', 'true');
    back.setAttribute('aria-label', 'Happy Canada Day from ample');
    back.innerHTML =
      '<div class="cdpop-card">' +
        '<button type="button" class="cdpop-close" aria-label="Close">×</button>' +
        '<img src="assets/canada-day-2026.webp" width="760" height="1267" ' +
             'alt="Happy Canada Day from ample." />' +
      '</div>';

    function close() {
      remember(POP_KEY);
      document.removeEventListener('keydown', onKey);
      if (back.parentNode) back.parentNode.removeChild(back);
    }
    function onKey(e) { if (e.key === 'Escape' || e.keyCode === 27) close(); }

    back.addEventListener('click', function (e) { if (e.target === back) close(); });
    back.querySelector('.cdpop-close').addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
  }

  function init() {
    if (new Date() >= CUTOFF || !document.body) return; // season passed
    buildBanner();
    buildPopup();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
